
services:
  api:
    build: .
    container_name: resume-viva-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: resume-viva-frontend
    ports:
      - "8601:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
